name: Test TOS 7 Deb Package

on:
  workflow_dispatch:
    inputs:
      upload_to_tdp:
        description: "Publish a test prerelease and validate it on TerraMaster (no review submission)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/tos-package-test.yml"
      - "packages/tos/**"
      - "scripts/pack-tos-deb.mjs"
      - "scripts/test-tos-platform.mjs"
      - "tests/server/tos-packaging.test.ts"
      - "tests/server/tos-platform.test.ts"

permissions:
  contents: read

concurrency:
  group: tos-package-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tos:
    name: TOS 7 x86_64 test package
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Build Web UI
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Verify image processing runtime
        run: npm run verify:sharp-runtime

      - name: Stage production Web UI
        shell: bash
        run: |
          set -euo pipefail
          tos_stage="$RUNNER_TEMP/ekko-tos-webui"
          mkdir -p "$tos_stage"
          cp package.json package-lock.json "$tos_stage/"
          cp -R bin dist node_modules "$tos_stage/"
          printf 'TOS_WEBUI_DIR=%s\n' "$tos_stage" >> "$GITHUB_ENV"

      - name: Build and verify TOS 7 Deb
        run: npm run pack:tos -- --webui-dir "$TOS_WEBUI_DIR" --output release/tos

      - name: Upload TOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tos7-x86_64-test
          if-no-files-found: error
          retention-days: 7
          path: |
            release/tos/*.deb
            release/tos/*.deb.sha256
            release/tos/*.deb.verification.json

  platform:
    name: TerraMaster package parsing test (no review)
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_tdp
    needs: tos
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: tos-platform-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: tos7-x86_64-test
          path: release/tos
      - name: Publish test assets and validate on TerraMaster
        env:
          # The built-in token prevents release events triggering other workflows.
          GH_TOKEN: ${{ github.token }}
          TDP_API_TOKEN: ${{ secrets.TDP_API_TOKEN }}
        run: node scripts/test-tos-platform.mjs release/tos
      - name: Upload platform test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tos-platform-test-receipt
          path: release/tos/platform-test.json
          if-no-files-found: warn
          retention-days: 7
