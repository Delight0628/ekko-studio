name: Authorized TOS 0.7.36 remediation resubmission
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect is read-only; submit is restricted to the recorded review/package'
        required: true
        type: choice
        default: inspect
        options: [inspect, submit]
permissions:
  contents: read
concurrency:
  group: tos-platform-test
  cancel-in-progress: false
jobs:
  resubmit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect or execute the user-authorized remediation
        env:
          TDP_API_TOKEN: ${{ secrets.TDP_API_TOKEN }}
          TOS_MODE: ${{ inputs.mode }}
        run: node scripts/tos-resubmit-once.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tos-resubmit-receipt
          path: tos-resubmit-receipt.json
          if-no-files-found: error
          retention-days: 7
